[package]
name = "kobutai-desktop"
version = "0.1.0"
description = "Kobutai desktop: a transparent always-on-top stage that reacts to system media sessions"
license = "MIT"
edition = "2021"
rust-version = "1.77"

# Pure logic and wire types live in a small library target so `cargo test` never has to run a Tauri
# executable (on Windows, test binaries of a Tauri app can fail to start without the app manifest).
[lib]
name = "kobutai_core"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "kobutai-desktop"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Foundation",
  "Media_Control",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_WinRT",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

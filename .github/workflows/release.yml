# Publishes a GitHub Release for every new extension version (the "version" in package.json).
#
# Assets (the website's download section links to the stable names via releases/latest/download/):
#   kobutai-extension.zip         extension for Chrome, Edge and other Chromium browsers (manual install)
#   kobutai-<version>-chrome.zip  the same file under its versioned name (what the stores receive)
#   kobutai-windows-setup.exe     Windows desktop preview, NSIS installer, UNSIGNED
#   kobutai-windows.msi           Windows desktop preview, MSI, UNSIGNED
#
# Runs when package.json, the desktop app or this file changes on main, or by hand (Actions → Release →
# Run workflow). If the release for the current version already exists it is left alone, except on a
# manual run, which replaces its assets.
name: Release
on:
  push:
    branches: [main]
    paths: ['package.json', 'desktop/**', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1 && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Release v$version already exists; nothing to do."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  extension:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run zip
      - name: Stable name for the website link
        run: cp .output/kobutai-${{ needs.check.outputs.version }}-chrome.zip .output/kobutai-extension.zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            .output/kobutai-${{ needs.check.outputs.version }}-chrome.zip
            .output/kobutai-extension.zip
          if-no-files-found: error

  windows:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'
      - run: npm ci
      - run: npm run desktop:build
      - name: Stable names for the website links
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item (Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1).FullName out/kobutai-windows-setup.exe
          Copy-Item (Get-ChildItem desktop/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1).FullName out/kobutai-windows.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  publish:
    needs: [check, extension, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cat > notes.md <<EOF
          ## Install

          - **Chrome**: [Chrome Web Store](https://chromewebstore.google.com/detail/dmoinepmnonlmffdeelhgbobllhejpfc)
          - **Edge**: [Edge Add-ons](https://microsoftedge.microsoft.com/addons/detail/oeajknlpejimdfgpipgkgoilhmdlgpgg)
          - **Other Chromium browsers (360, QQ Browser, Brave, Opera…) or no store access**: download \`kobutai-extension.zip\`, unzip it, open the browser's extensions page, turn on Developer mode, choose **Load unpacked** and pick the unzipped folder. Manual installs don't update themselves; download the new zip from here when a new version comes out.
          - **Windows desktop (preview)**: \`kobutai-windows-setup.exe\`. Step-by-step: https://kobutai.pages.dev/install.html The installer is not signed yet, so Windows may show "Windows protected your PC": click **More info** → **Run anyway**.

          ## 安装

          - **Chrome**：[Chrome 应用商店](https://chromewebstore.google.com/detail/dmoinepmnonlmffdeelhgbobllhejpfc)
          - **Edge**：[Edge 加载项商店](https://microsoftedge.microsoft.com/addons/detail/oeajknlpejimdfgpipgkgoilhmdlgpgg)（国内可以正常访问）
          - **360、QQ 浏览器等其他 Chromium 浏览器，或打不开商店时**：下载 \`kobutai-extension.zip\` 并解压，打开浏览器的扩展管理页，开启"开发者模式"，点"加载已解压的扩展程序"，选择解压出来的文件夹。手动安装不会自动更新，有新版本时请回到这里重新下载。
          - **Windows 桌面版（预览）**：\`kobutai-windows-setup.exe\`。详细步骤：https://kobutai.pages.dev/install.html?lang=zh安装包还没有签名，Windows 可能提示"Windows 已保护你的电脑"，点"更多信息"→"仍要运行"。
          EOF
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" assets/* --clobber
            gh release edit "v$VERSION" --notes-file notes.md
          else
            gh release create "v$VERSION" assets/* --title "Kobutai $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
          fi
